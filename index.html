<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- Sekme ikonu PNG/ICO: Safari SVG favicon göstermiyor, yerine başlığın
         ilk harfini ("R") koyuyordu. Beyaz kare üstünde bordo şapka — koyu
         sekme çubuğunda da görünsün diye zeminli. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Rehberim</title>
    <script>
      // Apply the stored theme before first paint so dark-mode users don't get a light flash.
      try {
        document.documentElement.setAttribute(
          'data-theme',
          localStorage.getItem('theme') || 'light'
        );
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
